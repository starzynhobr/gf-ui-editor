[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gf-ui-editor"
dynamic = ["version"]
description = "Editor visual para os XMLs de interface do Grand Fantasia Violet"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
gf-ui-editor = "gf_ui_editor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "gf_ui_editor.__version__"}

[tool.setuptools.package-data]
gf_ui_editor = ["assets/*.png", "translations/*.qm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
